<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wevitation — Kirim Undangan</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --pink: #C4186A;
      --pink-hover: #A5125A;
      --pink-light: #FFF0F7;
      --pink-border: #F0C0D8;
      --sidebar: #1A1A2E;
      --sidebar-active: #C4186A;
      --bg: #F8FAFC;
      --white: #FFFFFF;
      --border: #E2E8F0;
      --text: #0F172A;
      --sub: #64748B;
      --green: #10B981;
      --green-bg: #D1FAE5;
      --blue: #3B82F6;
      --blue-bg: #DBEAFE;
      --r8: 8px;
      --r12: 12px;
      --r16: 16px;
      --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.05);
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
      --shadow-lg: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      min-height: 100vh;
      font-size: 14px;
    }

    /* SIDEBAR */
    .sidebar {
      width: 86px;
      background: var(--sidebar);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 0 0 20px;
      position: fixed;
      top: 0;
      left: 0;
      height: 100vh;
      z-index: 200;
    }

    .sb-logo {
      width: 100%;
      height: 86px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      border-bottom: 1px solid rgba(255, 255, 255, .05);
      margin-bottom: 16px;
    }

    .sb-logo-circle {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: rgba(196, 24, 106, 0.2);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .sb-logo svg {
      width: 22px;
      height: 22px;
      stroke: var(--pink);
      fill: none;
      stroke-width: 2.5;
    }

    .sb-logo span {
      font-size: 10px;
      font-weight: 700;
      color: #94A3B8;
      letter-spacing: .05em;
    }

    .sb-nav {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
      align-items: center;
    }

    .sb-item {
      width: 64px;
      height: 64px;
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      cursor: pointer;
      transition: all .2s;
    }

    .sb-item:hover {
      background: rgba(255, 255, 255, .05);
    }

    .sb-item.active {
      background: var(--pink);
      box-shadow: 0 4px 12px rgba(196, 24, 106, 0.4);
    }

    .sb-item svg {
      width: 24px;
      height: 24px;
      stroke: #64748B;
      stroke-width: 2;
      fill: none;
      transition: stroke .2s;
    }

    .sb-item.active svg {
      stroke: #fff;
    }

    .sb-item span {
      font-size: 11px;
      color: #64748B;
      font-weight: 500;
      transition: color .2s;
    }

    .sb-item.active span {
      color: #fff;
      font-weight: 600;
    }

    /* MAIN */
    .main {
      margin-left: 86px;
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      overflow-x: clip;
    }

    /* TOPBAR */
    .topbar {
      height: 60px;
      background: var(--white);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 28px;
      gap: 14px;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: var(--shadow-sm);
    }

    .tb-title {
      font-size: 16px;
      font-weight: 700;
      color: var(--text);
    }

    .tb-avatar {
      margin-left: auto;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: var(--pink);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 700;
      color: #fff;
      cursor: pointer;
    }

    /* KIRIM PAGE & CARD STYLES */
    .page-kirim {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 40px 20px;
      flex: 1;
    }

    .kirim-wrapper {
      width: 100%;
      max-width: 520px;
    }

    .progress-bar-container {
      width: 100%;
      height: 6px;
      background: var(--border);
      border-radius: 6px;
      margin-bottom: 24px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      background: var(--pink);
      width: 0%;
      transition: width 0.4s ease;
    }

    .kirim-card {
      background: var(--white);
      border-radius: var(--r16);
      display: flex;
      flex-direction: column;
      box-shadow: var(--shadow-lg);
      border: 1px solid var(--border);
      overflow: hidden;
    }

    .kc-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 24px 32px;
      background: var(--white);
      border-bottom: 1px solid var(--border);
    }

    .kc-title-wrap {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .kc-title {
      font-size: 20px;
      font-weight: 700;
      color: var(--text);
    }

    .kc-subtitle {
      font-size: 13px;
      color: var(--sub);
      font-weight: 500;
    }

    .kc-status-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      background: #F1F5F9;
      color: var(--sub);
      transition: all 0.3s;
    }

    .kc-status-badge.sent-all {
      background: var(--green-bg);
      color: var(--green);
    }

    .kc-body {
      padding: 32px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .guest-info-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      background: #F8FAFC;
      padding: 20px;
      border-radius: var(--r12);
      border: 1px solid var(--border);
    }

    .info-item {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .info-item.full {
      grid-column: span 2;
    }

    .info-label {
      font-size: 12px;
      color: var(--sub);
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .info-value {
      font-size: 15px;
      color: var(--text);
      font-weight: 600;
    }

    .info-value.name {
      font-size: 18px;
      color: var(--pink);
    }

    .action-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .btn-action {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 16px;
      border-radius: var(--r12);
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      background: var(--white);
      transition: all 0.2s ease;
      position: relative;
      overflow: hidden;
    }

    .btn-action span {
      position: relative;
      z-index: 2;
    }

    .btn-action svg.icon-main {
      width: 20px;
      height: 20px;
      stroke: currentColor;
      stroke-width: 2;
      fill: none;
      position: relative;
      z-index: 2;
    }

    /* WA Button */
    .btn-wa {
      border: 2px solid var(--green);
      color: var(--green);
      box-shadow: 0 4px 12px rgba(16, 185, 129, 0.1);
    }

    .btn-wa:hover:not(.sent) {
      background: var(--green-bg);
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(16, 185, 129, 0.15);
    }

    .btn-wa.sent {
      background: var(--green);
      color: var(--white);
      border-color: var(--green);
    }

    /* Copy Buttons */
    .actions-row {
      display: flex;
      gap: 12px;
    }

    .btn-copy {
      flex: 1;
      border: 2px solid var(--blue);
      color: var(--blue);
    }

    .btn-copy:hover:not(.sent) {
      background: var(--blue-bg);
      transform: translateY(-2px);
    }

    .btn-copy.sent {
      background: var(--blue);
      color: var(--white);
      border-color: var(--blue);
    }

    /* Footer & Navigation */
    .kc-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 24px 32px;
      background: #F8FAFC;
      border-top: 1px solid var(--border);
    }

    .kc-pagination-info {
      font-size: 14px;
      color: var(--sub);
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .kc-pagination-info span {
      color: var(--text);
    }

    .kc-nav-btns {
      display: flex;
      gap: 12px;
    }

    .btn-nav {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px 16px;
      border-radius: var(--r8);
      border: 1px solid var(--border);
      background: var(--white);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      color: var(--text);
      transition: all 0.2s;
    }

    .btn-nav svg {
      width: 18px;
      height: 18px;
      stroke: currentColor;
      stroke-width: 2;
      fill: none;
    }

    .btn-nav:hover:not(:disabled) {
      background: #F1F5F9;
      border-color: #CBD5E1;
    }

    .btn-nav:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      background: #F8FAFC;
    }

    /* Check Icon Overlay */
    .icon-check-circle {
      display: none;
      width: 24px;
      height: 24px;
      background: var(--white);
      border-radius: 50%;
      align-items: center;
      justify-content: center;
      position: absolute;
      right: 16px;
      z-index: 2;
    }

    .icon-check-circle svg {
      width: 14px;
      height: 14px;
      stroke: var(--green);
      stroke-width: 3;
      fill: none;
    }

    .btn-copy.sent .icon-check-circle svg {
      stroke: var(--blue);
    }

    .sent .icon-check-circle {
      display: flex;
      animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }

    .sent .icon-main {
      opacity: 0;
    }

    @keyframes popIn {
      0% {
        transform: scale(0);
        opacity: 0;
      }

      100% {
        transform: scale(1);
        opacity: 1;
      }
    }

    /* Filter & Bulk Styles */
    .filter-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      gap: 12px;
    }
    .filter-chips {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 4px;
    }
    .chip {
      padding: 6px 14px;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: var(--white);
      font-size: 13px;
      font-weight: 600;
      color: var(--sub);
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s;
    }
    .chip:hover {
      background: #F1F5F9;
    }
    .chip.active {
      background: var(--text);
      color: var(--white);
      border-color: var(--text);
    }
  </style>
</head>

<body>

  <!-- SIDEBAR (Template Style) -->
  <div class="sidebar">
    <div class="sb-logo">

      </div>

              <div class="info-item">

              <div class="info-item">

                </button>
                <button class="btn-action btn-copy" id="btnText" onclick="triggerAction('text')">

                </button>
              </div>
            </div>

          </div>

          <div class="kc-footer">

    ];

    let filteredGuests = [...guestBook];
    let currentIndex = 0;

    // --- DOM ELEMENTS ---
    const elName = document.getElementById('gName');
    const elGroup = document.getElementById('gGroup');
    const elLevel = document.getElementById('gLevel');
    const elEvent = document.getElementById('gEvent');
    const elRsvp = document.getElementById('gRsvp');

    const btnWa = document.getElementById('btnWa');
    const btnUrl = document.getElementById('btnUrl');
    const btnText = document.getElementById('btnText');

    const pagCurrent = document.getElementById('pagCurrent');
    const pagTotal = document.getElementById('pagTotal');
    const btnPrev = document.getElementById('btnPrev');
    const btnNext = document.getElementById('btnNext');

    const statusBadge = document.getElementById('statusBadge');
    const progressBar = document.getElementById('progressBar');
    const card = document.getElementById('kirimCard');

    // --- FUNCTIONS ---
    function renderGuest(index) {
      if (filteredGuests.length === 0) {
        card.style.display = 'none';
        return;
      }
      card.style.display = 'flex';
      
      const guest = filteredGuests[index];

      // Update Info
      elName.innerText = `${guest.sapaan} ${guest.name}`;
      elGroup.innerText = guest.group;
      elLevel.innerText = guest.level;
      elEvent.innerText = guest.event;
      elRsvp.innerText = `${guest.maxRsvp} Orang`;

      // Update Action Buttons State
      updateButtonState(btnWa, guest.sentWA, 'Kirim via WhatsApp', 'Terkirim WA');
      updateButtonState(btnUrl, guest.sentUrl, 'Copy URL', 'URL Dicopy');
      updateButtonState(btnText, guest.sentText, 'Copy Text', 'Teks Dicopy');

      // Update Status Badge
      const anySent = guest.sentWA || guest.sentUrl || guest.sentText;
      if (anySent) {
        statusBadge.className = 'kc-status-badge sent-all';
        statusBadge.innerHTML = `<svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2" fill="none"><polyline points="20 6 9 17 4 12"></polyline></svg> Sudah Diinteraksi`;
      } else {
        statusBadge.className = 'kc-status-badge';
        statusBadge.innerHTML = `<svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2" fill="none"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg> Belum Dikirim`;
      }

      // Update Pagination
      pagCurrent.innerText = index + 1;
      pagTotal.innerText = filteredGuests.length;

      // Update Progress Bar
      progressBar.style.width = `${((index + 1) / filteredGuests.length) * 100}%`;

      // Update Navigation Button States
      btnPrev.disabled = index === 0;
      btnNext.disabled = index === filteredGuests.length - 1;
    }

    function updateButtonState(btnEl, isSent, textNormal, textSent) {
      const span = btnEl.querySelector('span');
      if (isSent) {
        btnEl.classList.add('sent');
        span.innerText = textSent;
      } else {
        btnEl.classList.remove('sent');
        span.innerText = textNormal;
      }
    }

    function triggerAction(type) {
      const guest = filteredGuests[currentIndex];

      if (type === 'wa') guest.sentWA = true;
      if (type === 'url') guest.sentUrl = true;
      if (type === 'text') guest.sentText = true;

      // Re-render current guest to update UI
      renderGuest(currentIndex);

      // Optional: simulate copy to clipboard or open WA link here
      if (type === 'wa') console.log(`Membuka WhatsApp untuk ${guest.name}...`);
      if (type === 'url') console.log(`URL ${guest.name} dicopy...`);
      if (type === 'text') console.log(`Teks ${guest.name} dicopy...`);
    }

    function navigate(step) {
      const newIndex = currentIndex + step;
      if (newIndex >= 0 && newIndex < filteredGuests.length) {
        currentIndex = newIndex;
        renderGuest(currentIndex);
      }
    }
    
    function setFilter(filterType, btnEl) {
      // Update Active Chip
      document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
      btnEl.classList.add('active');
      
      // Filter Logic
      if (filterType === 'semua') {
        filteredGuests = [...guestBook];
      } else if (filterType === 'belum') {
        filteredGuests = guestBook.filter(g => !(g.sentWA || g.sentUrl || g.sentText));
      } else if (filterType === 'sudah') {
        filteredGuests = guestBook.filter(g => (g.sentWA || g.sentUrl || g.sentText));
      } else if (filterType === 'vip') {
        filteredGuests = guestBook.filter(g => g.level.toLowerCase().includes('vip'));
      }
      
      currentIndex = 0;
      if (filteredGuests.length > 0) {
        renderGuest(currentIndex);
      } else {
        card.style.display = 'none';
        alert('Tidak ada tamu yang sesuai dengan filter ini.');
      }
    }

    // --- INITIALIZE ---
    document.addEventListener('DOMContentLoaded', () => {
      renderGuest(currentIndex);
    });
  </script>
