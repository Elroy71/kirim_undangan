<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wevitation — Kirim Undangan</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --pink: #C4186A;
      --pink-hover: #A5125A;
      --pink-light: #FFF0F7;
      --pink-border: #F0C0D8;
      --sidebar: #1A1A2E;
      --sidebar-active: #C4186A;
      --bg: #F8FAFC;
      --white: #FFFFFF;
      --border: #E2E8F0;
      --text: #0F172A;
      --sub: #64748B;
      --green: #10B981;
      --green-bg: #D1FAE5;
      --blue: #3B82F6;
      --blue-bg: #DBEAFE;
      --r8: 8px;
      --r12: 12px;
      --r16: 16px;
      --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.05);
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
      --shadow-lg: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      min-height: 100vh;
      font-size: 14px;
    }

    /* SIDEBAR */
    .sidebar {
      width: 86px;
      background: var(--sidebar);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 0 0 20px;
      position: fixed;
      top: 0;
      left: 0;
      height: 100vh;
      z-index: 200;
    }

    .sb-logo {
      width: 100%;
      height: 86px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      border-bottom: 1px solid rgba(255, 255, 255, .05);
      margin-bottom: 16px;
    }

    .sb-logo-circle {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: rgba(196, 24, 106, 0.2);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .sb-logo svg {
      width: 22px;
      height: 22px;
      stroke: var(--pink);
      fill: none;
      stroke-width: 2.5;
    }

    .sb-logo span {
      font-size: 10px;
      font-weight: 700;
      color: #94A3B8;
      letter-spacing: .05em;
    }

    .sb-nav {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
      align-items: center;
    }

    .sb-item {
      width: 64px;
      height: 64px;
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      cursor: pointer;
      transition: all .2s;
    }

    .sb-item:hover {
      background: rgba(255, 255, 255, .05);
    }

    .sb-item.active {
      background: var(--pink);
      box-shadow: 0 4px 12px rgba(196, 24, 106, 0.4);
    }

    .sb-item svg {
      width: 24px;
      height: 24px;
      stroke: #64748B;
      stroke-width: 2;
      fill: none;
      transition: stroke .2s;
    }

    .sb-item.active svg {
      stroke: #fff;
    }

    .sb-item span {
      font-size: 11px;
      color: #64748B;
      font-weight: 500;
      transition: color .2s;
    }

    .sb-item.active span {
      color: #fff;
      font-weight: 600;
    }

    /* MAIN */
    .main {
      margin-left: 86px;
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      overflow-x: clip;
    }

    /* TOPBAR */
    .topbar {
      height: 60px;
      background: var(--white);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 28px;
      gap: 14px;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: var(--shadow-sm);
    }

    .tb-title {
      font-size: 16px;
      font-weight: 700;
      color: var(--text);
    }

    .tb-stats {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      background: #F1F5F9;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      margin-left: 12px;
      border: 1px solid var(--border);
    }

    .stat-sent {
      color: var(--green);
    }

    .stat-divider {
      color: #CBD5E1;
      font-weight: 400;
    }

    .stat-remain {
      color: var(--sub);
    }

    .tb-avatar {
      margin-left: auto;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: var(--pink);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 700;
      color: #fff;
      cursor: pointer;
    }

    /* KIRIM PAGE & CARD STYLES */
    .page-kirim {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 40px 20px;
      flex: 1;
    }

    .kirim-wrapper {
      width: 100%;
      max-width: 520px;
    }

    .progress-bar-container {
      width: 100%;
      height: 6px;
      background: var(--border);
      border-radius: 6px;
      margin-bottom: 24px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      background: var(--pink);
      width: 0%;
      transition: width 0.4s ease;
    }

    .kirim-card {
      background: var(--white);
      border-radius: var(--r16);
      display: flex;
      flex-direction: column;
      box-shadow: var(--shadow-lg);
      border: 1px solid var(--border);
      overflow: hidden;
    }

    .kc-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 24px 32px;
      background: var(--white);
      border-bottom: 1px solid var(--border);
    }

    .kc-title-wrap {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .kc-title {
      font-size: 20px;
      font-weight: 700;
      color: var(--text);
    }

    .kc-subtitle {
      font-size: 13px;
      color: var(--sub);
      font-weight: 500;
    }

    .kc-status-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      background: #F1F5F9;
      color: var(--sub);
      transition: all 0.3s;
    }

    .kc-status-badge.sent-all {
      background: var(--green-bg);
      color: var(--green);
    }

    .kc-body {
      padding: 32px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .guest-info-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      background: #F8FAFC;
      padding: 20px;
      border-radius: var(--r12);
      border: 1px solid var(--border);
    }

    .info-item {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .info-item.full {
      grid-column: span 2;
    }

    .info-label {
      font-size: 12px;
      color: var(--sub);
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .info-value {
      font-size: 15px;
      color: var(--text);
      font-weight: 600;
    }

    .info-value.name {
      font-size: 18px;
      color: var(--pink);
    }

    .action-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .btn-action {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 16px;
      border-radius: var(--r12);
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      background: var(--white);
      transition: all 0.2s ease;
      position: relative;
      overflow: hidden;
    }

    .btn-action span {
      position: relative;
      z-index: 2;
    }

    .btn-action svg.icon-main {
      width: 20px;
      height: 20px;
      stroke: currentColor;
      stroke-width: 2;
      fill: none;
      position: relative;
      z-index: 2;
    }

    /* WA Button */
    .btn-wa {
      border: 2px solid var(--green);
      color: var(--green);
      box-shadow: 0 4px 12px rgba(16, 185, 129, 0.1);
    }

    .btn-wa:hover:not(.sent) {
      background: var(--green-bg);
      box-shadow: 0 6px 16px rgba(16, 185, 129, 0.15);
    }

    .btn-wa.sent {
      background: var(--green);
      color: var(--white);
      border-color: var(--green);
    }

    /* Copy Buttons */
    .actions-row {
      display: flex;
      gap: 12px;
    }

    .btn-copy {
      flex: 1;
      border: 2px solid var(--blue);
      color: var(--blue);
    }

    .btn-copy:hover:not(.sent) {
      background: var(--blue-bg);
    }

    .btn-copy.sent {
      background: var(--blue);
      color: var(--white);
      border-color: var(--blue);
    }

    /* Footer & Navigation */
    .kc-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 24px 32px;
      background: #F8FAFC;
      border-top: 1px solid var(--border);
    }

    .kc-pagination-info {
      font-size: 14px;
      color: var(--sub);
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .kc-pagination-info span {
      color: var(--text);
    }

    .kc-nav-btns {
      display: flex;
      gap: 12px;
    }

    .btn-nav {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px 16px;
      border-radius: var(--r8);
      border: 1px solid var(--border);
      background: var(--white);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      color: var(--text);
      transition: all 0.2s;
    }

    .btn-nav svg {
      width: 18px;
      height: 18px;
      stroke: currentColor;
      stroke-width: 2;
      fill: none;
    }

    .btn-nav:hover:not(:disabled) {
      background: #F1F5F9;
      border-color: #CBD5E1;
    }

    .btn-nav:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      background: #F8FAFC;
    }



    /* Filter & Bulk Styles */
    .filter-bar {
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 16px;
      gap: 12px;
    }

    .filter-chips {
      display: flex;
      justify-content: center;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 4px;
    }

    .chip {
      padding: 6px 14px;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: var(--white);
      font-size: 13px;
      font-weight: 600;
      color: var(--sub);
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s;
    }

    .chip:hover {
      background: #F1F5F9;
    }

    .chip.active {
      background: var(--text);
      color: var(--white);
      border-color: var(--text);
    }

    /* Additional UI Concepts */

    .btn-undo-large {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      background: var(--white);
      color: var(--text);
      border: 1px solid var(--border);
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-undo-large:hover {
      background: #F1F5F9;
    }

    /* MOBILE RESPONSIVE */
    @media screen and (max-width: 426px) {

      html,
      body {
        overflow-x: hidden;
        width: 100%;
      }

      .sidebar {
        display: none !important;
      }

      .sb-logo {
        display: none !important;
      }

      .sb-nav {
        flex-direction: row;
        justify-content: space-evenly;
        align-items: center;
        height: 100%;
        width: 100%;
        gap: 0;
      }

      .sb-item {
        width: 48px;
        height: 48px;
        flex-shrink: 0;
      }

      .sb-item span {
        display: none;
      }

      .sb-item.active {
        box-shadow: 0 2px 8px rgba(196, 24, 106, 0.4);
      }

      .main {
        margin-left: 0;
        margin-bottom: 0;
        width: 100%;
        max-width: 100vw;
      }

      .topbar {
        padding: 0 16px;
        width: 100%;
      }

      .tb-title {
        font-size: 15px;
        white-space: nowrap;
      }

      .tb-stats {
        margin-left: auto;
        padding: 6px 10px;
        font-size: 11px;
        white-space: nowrap;
      }

      .tb-avatar {
        display: none;
      }

      .page-kirim {
        padding: 16px;
        width: 100%;
        box-sizing: border-box;
      }

      .kirim-wrapper {
        width: 100%;
        max-width: 100%;
      }

      .filter-bar {
        width: 100%;
        flex-direction: column;
        align-items: stretch;
      }

      .filter-chips {
        width: 100%;
        max-width: calc(100vw - 32px);
        padding-bottom: 8px;
      }

      .kirim-card {
        width: 100%;
        display: flex;
        flex-direction: column;
        max-height: calc(100vh - 190px);
      }

      .kc-body {
        overflow-y: auto;
        flex: 1;
      }

      .kc-header,
      .kc-body,
      .kc-footer {
        padding: 16px;
        box-sizing: border-box;
      }

      .kc-header {
        flex-direction: column;
        align-items: flex-start;
        gap: 12px;
      }

      .kc-title {
        font-size: 18px;
      }

      .guest-info-grid {
        padding: 16px;
        width: 100%;
        box-sizing: border-box;
      }

      .actions-row {
        flex-direction: row;
        width: 100%;
        box-sizing: border-box;
      }

      .btn-action {
        width: 100%;
        box-sizing: border-box;
      }

      .kc-footer {
        flex-direction: column;
        gap: 16px;
        align-items: center;
      }

      .kc-pagination-info {
        text-align: center;
      }

      .kc-nav-btns {
        width: 100%;
      }

      .btn-nav {
        flex: 1;
      }
    }
  </style>
</head>

<body>

  <!-- SIDEBAR (Template Style) -->
  <div class="sidebar">
    <div class="sb-logo">
      <div class="sb-logo-circle">
        <svg viewBox="0 0 24 24">
          <polyline points="6 9 12 15 18 9"></polyline>
        </svg>
      </div>
      <span style="color: #60A5FA;">WEVI</span>
    </div>

    <div class="sb-nav">
      <div class="sb-item">
        <svg viewBox="0 0 24 24">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
          <polyline points="9 22 9 12 15 12 15 22"></polyline>
        </svg>
        <span>Home</span>
      </div>

      <div class="sb-item">
        <svg viewBox="0 0 24 24">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
          <polyline points="14 2 14 8 20 8"></polyline>
          <line x1="16" y1="13" x2="8" y2="13"></line>
          <line x1="16" y1="17" x2="8" y2="17"></line>
          <polyline points="10 9 9 9 8 9"></polyline>
        </svg>
        <span>Undangan</span>
      </div>

      <div class="sb-item active">
        <svg viewBox="0 0 24 24">
          <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
          <circle cx="9" cy="7" r="4"></circle>
          <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
          <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
        </svg>
        <span>Kirim</span>
      </div>

      <div class="sb-item">
        <svg viewBox="0 0 24 24">
          <line x1="12" y1="1" x2="12" y2="23"></line>
          <path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path>
        </svg>
        <span>Transaksi</span>
      </div>

      <div class="sb-item">
        <svg viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="10"></circle>
          <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path>
          <line x1="12" y1="17" x2="12.01" y2="17"></line>
        </svg>
        <span>CS</span>
      </div>
    </div>
  </div>

  <div class="main">
    <!-- TOPBAR -->
    <div class="topbar">
      <div class="tb-title">Kirim Undangan</div>
      <div class="tb-stats" id="topStats">
        <span class="stat-sent" id="statSent">0 Terkirim</span>
        <span class="stat-divider">|</span>
        <span class="stat-remain" id="statRemain">0 Sisa</span>
      </div>
      <div class="tb-avatar">W</div>
    </div>

    <!-- MAIN CONTENT -->
    <div class="page-kirim">
      <div class="kirim-wrapper">

        <div class="filter-bar">
          <div class="filter-chips">
            <button class="chip active" onclick="setFilter('semua', this)">Semua</button>
            <button class="chip" onclick="setFilter('belum', this)">Belum Dikirim</button>
            <button class="chip" onclick="setFilter('sudah', this)">Sudah Dikirim</button>
          </div>
        </div>

        <div class="progress-bar-container">
          <div class="progress-bar" id="progressBar"></div>
        </div>

          <div class="kirim-card" id="kirimCard">

            <div class="kc-header">
              <div class="kc-title-wrap">
                <div class="kc-title">Detail Tamu</div>
              </div>
              <div style="display: flex; gap: 8px; align-items: center;">
                <button onclick="undoStatus(event)" id="btnUndoGlobal" class="btn-undo-large" style="display: none;"
                  title="Batalkan status terkirim">
                  <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2" fill="none">
                    <path d="M3 7v6h6"></path>
                    <path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13"></path>
                  </svg> Undo
                </button>
                <div class="kc-status-badge" id="statusBadge">
                  <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2" fill="none">
                    <circle cx="12" cy="12" r="10"></circle>
                    <line x1="12" y1="8" x2="12" y2="12"></line>
                    <line x1="12" y1="16" x2="12.01" y2="16"></line>
                  </svg>
                  Belum Dikirim
                </div>
              </div>
            </div>

            <div class="kc-body">

              <div class="guest-info-grid">
                <div class="info-item full">
                  <div class="info-label">Sapaan & Nama Tamu</div>
                  <div class="info-value name" id="gName">Yth. Bapak/Ibu John Doe</div>
                </div>
                <div class="info-item">
                  <div class="info-label">Grup Tamu</div>
                  <div class="info-value" id="gGroup">Keluarga</div>
                </div>
                <div class="info-item">
                  <div class="info-label">Level</div>
                  <div class="info-value" id="gLevel">VIP</div>
                </div>
                <div class="info-item">
                  <div class="info-label">Acara</div>
                  <div class="info-value" id="gEvent">Akad, Resepsi</div>
                </div>
                <div class="info-item">
                  <div class="info-label">Max RSVP</div>
                  <div class="info-value" id="gRsvp">2 Orang</div>
                </div>
                <div class="info-item full">
                  <div class="info-label" style="display:flex; align-items:center;">
                    Kode Undangan
                    <span id="btnToggleCode" onclick="toggleCode()"
                      style="margin-left:8px; cursor:pointer; color:var(--sub); display:flex; align-items:center;"
                      title="Lihat"></span>
                  </div>
                  <div class="info-value" id="gCode"
                    style="letter-spacing: 2px; font-family: monospace; font-size: 16px;">••••••••</div>
                </div>
              </div>

              <div class="action-container">
                <button class="btn-action btn-wa" id="btnWa" onclick="triggerAction('wa')">
                  <svg class="icon-main" viewBox="0 0 24 24">
                    <path
                      d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z">
                    </path>
                  </svg>
                  <span>Kirim via WhatsApp</span>
                </button>

                <div class="actions-row">
                  <button class="btn-action btn-copy" id="btnUrl" onclick="triggerAction('url')">
                    <svg class="icon-main" viewBox="0 0 24 24">
                      <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path>
                      <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path>
                    </svg>
                    <span>Copy URL</span>
                  </button>
                  <button class="btn-action btn-copy" id="btnText" onclick="triggerAction('text')">
                    <svg class="icon-main" viewBox="0 0 24 24">
                      <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                      <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                    </svg>
                    <span>Copy Text</span>
                  </button>
                </div>
              </div>

            </div>

            <div class="kc-footer">
              <div class="kc-pagination-info">

    // --- MOCK DATA ---

      { id: 17, name: 'Qory Sandioriva', sapaan: 'Ibu', group: 'Rekan Kerja', level: 'Reguler', event: 'Resepsi', maxRsvp: 2, sentWA: false, sentUrl: true, sentText: false },

      { id: 21, name: 'Uus', sapaan: 'Saudara', group: 'Teman Main', level: 'Reguler', event: 'Resepsi', maxRsvp: 2, sentWA: false, sentUrl: false, sentText: false },
      { id: 22, name: 'Vidi Aldiano', sapaan: 'Saudara', group: 'Teman Dekat', level: 'VIP', event: 'Resepsi', maxRsvp: 2, sentWA: true, sentUrl: true, sentText: true },
      { id: 23, name: 'Wulan Guritno', sapaan: 'Ibu', group: 'Rekan Kerja', level: 'VIP', event: 'Resepsi', maxRsvp: 2, sentWA: false, sentUrl: false, sentText: false },
      { id: 24, name: 'Xavier Marks', sapaan: 'Bapak', group: 'Klien', level: 'Reguler', event: 'Resepsi', maxRsvp: 1, sentWA: false, sentUrl: false, sentText: false },
      { id: 25, name: 'Yura Yunita', sapaan: 'Saudari', group: 'Teman Dekat', level: 'VIP', event: 'Akad, Resepsi', maxRsvp: 2, sentWA: false, sentUrl: false, sentText: false },
      { id: 26, name: 'Zaskia Adya Mecca', sapaan: 'Ibu', group: 'Rekan Bisnis', level: 'VIP', event: 'Resepsi', maxRsvp: 3, sentWA: true, sentUrl: false, sentText: false },
      { id: 27, name: 'Arief Muhammad', sapaan: 'Bapak', group: 'Teman Main', level: 'Reguler', event: 'Resepsi', maxRsvp: 2, sentWA: false, sentUrl: false, sentText: false },
      { id: 28, name: 'Boy William', sapaan: 'Saudara', group: 'Teman Dekat', level: 'VIP', event: 'Akad, Resepsi', maxRsvp: 1, sentWA: false, sentUrl: false, sentText: false },
      { id: 29, name: 'Cinta Laura', sapaan: 'Saudari', group: 'Rekan Kerja', level: 'VVIP', event: 'Resepsi', maxRsvp: 2, sentWA: true, sentUrl: false, sentText: false },
      { id: 30, name: 'Denny Sumargo', sapaan: 'Bapak', group: 'Teman Artis', level: 'VIP', event: 'Resepsi', maxRsvp: 2, sentWA: false, sentUrl: false, sentText: false }
    ];

    let filteredGuests = [...guestBook];
    let currentIndex = 0;
    let currentFilterType = 'semua';

    // --- DOM ELEMENTS ---
    const elName = document.getElementById('gName');
    const elGroup = document.getElementById('gGroup');
    const elLevel = document.getElementById('gLevel');
    const elEvent = document.getElementById('gEvent');
    const elRsvp = document.getElementById('gRsvp');
    const elCode = document.getElementById('gCode');
    const btnToggleCode = document.getElementById('btnToggleCode');

    let codeVisible = false;

    const btnWa = document.getElementById('btnWa');
    const btnUrl = document.getElementById('btnUrl');
    const btnText = document.getElementById('btnText');

    const pagCurrent = document.getElementById('pagCurrent');
    const pagTotal = document.getElementById('pagTotal');
    const btnPrev = document.getElementById('btnPrev');
    const btnNext = document.getElementById('btnNext');

    const statusBadge = document.getElementById('statusBadge');
    const progressBar = document.getElementById('progressBar');
    const card = document.getElementById('kirimCard');

    // --- FUNCTIONS ---
    function toggleCode() {
      codeVisible = !codeVisible;
      renderCode();
    }

    function renderCode() {
      if (filteredGuests.length === 0) return;
      const guest = filteredGuests[currentIndex];
      const code = guest.code || `WVT${guest.id.toString().padStart(4, '0')}`;

      const eyeIcon = `<svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>`;
      const eyeOffIcon = `<svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>`;

      if (codeVisible) {
        elCode.innerText = code;
        btnToggleCode.innerHTML = eyeOffIcon;
        btnToggleCode.title = 'Sembunyikan';
      } else {
        elCode.innerText = '••••••••';
        btnToggleCode.innerHTML = eyeIcon;
        btnToggleCode.title = 'Lihat';
      }
    }

    function renderGuest(index) {
      if (filteredGuests.length === 0) {
        card.style.display = 'none';
        return;
      }
      card.style.display = 'flex';

      const guest = filteredGuests[index];

      // Update Info
      elName.innerText = `${guest.sapaan} ${guest.name}`;
      elGroup.innerText = guest.group;
      elLevel.innerText = guest.level;
      elEvent.innerText = guest.event;
      elRsvp.innerText = `${guest.maxRsvp} Orang`;

      codeVisible = false;
      renderCode();

      // Update Action Buttons State
      updateButtonState(btnWa, guest.sentWA, 'Kirim via WhatsApp', 'Terkirim WA');
      updateButtonState(btnUrl, guest.sentUrl, 'Copy URL', 'URL Dicopy');
      updateButtonState(btnText, guest.sentText, 'Copy Text', 'Teks Dicopy');

      // Update Status Badge
      const anySent = guest.sentWA || guest.sentUrl || guest.sentText;
      const btnUndoGlobal = document.getElementById('btnUndoGlobal');
      if (anySent) {
        btnUndoGlobal.style.display = 'flex';
        statusBadge.className = 'kc-status-badge sent-all';
        statusBadge.innerHTML = `<svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2" fill="none"><polyline points="20 6 9 17 4 12"></polyline></svg> <span>Sudah Dikirim</span>`;
      } else {
        btnUndoGlobal.style.display = 'none';
        statusBadge.className = 'kc-status-badge';
        statusBadge.innerHTML = `<svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2" fill="none"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg> <span>Belum Dikirim</span>`;
      }


      // Update Pagination
      pagCurrent.innerText = index + 1;
      pagTotal.innerText = filteredGuests.length;

      // Update Progress Bar
      progressBar.style.width = `${((index + 1) / filteredGuests.length) * 100}%`;

      // Update Navigation Button States
      btnPrev.disabled = index === 0;
      btnNext.disabled = index === filteredGuests.length - 1;
      updateDashboardStats();
    }

    function updateDashboardStats() {
      const total = guestBook.length;
      const sent = guestBook.filter(g => g.sentWA || g.sentUrl || g.sentText).length;
      const remain = total - sent;

      document.getElementById('statSent').innerText = `${sent} Terkirim`;
      document.getElementById('statRemain').innerText = `${remain} Sisa`;
    }

    function updateButtonState(btnEl, isSent, textNormal, textSent) {
      const span = btnEl.querySelector('span');
      if (isSent) {
        btnEl.classList.add('sent');
        span.innerText = textSent;
      } else {
        btnEl.classList.remove('sent');
        span.innerText = textNormal;
      }
    }

    function triggerAction(type) {
      const guest = filteredGuests[currentIndex];

      if (type === 'wa') guest.sentWA = true;
      if (type === 'url') guest.sentUrl = true;
      if (type === 'text') guest.sentText = true;

      // Re-render current guest to update UI
      renderGuest(currentIndex);

      // Open WhatsApp or copy text
      if (type === 'wa') {
        const text = `Halo ${guest.sapaan} ${guest.name},\nKami mengundang Anda untuk hadir di acara pernikahan kami. Cek undangan: https://wevitation.com/undangan/${guest.id}`;
        window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(text)}`, '_blank');
      }
      if (type === 'url') console.log(`URL ${guest.name} dicopy...`);
      if (type === 'text') console.log(`Teks ${guest.name} dicopy...`);
    }

    function navigate(step) {
      const newIndex = currentIndex + step;
      if (newIndex >= 0 && newIndex < filteredGuests.length) {
        currentIndex = newIndex;
        renderGuest(currentIndex);
      }
    }

    function setFilter(filterType, btnEl) {
      if (btnEl) {
        document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
        btnEl.classList.add('active');
      }
      currentFilterType = filterType;
      applyFilters();
    }

    function applyFilters() {
      let temp = guestBook;

      // Filter Logic
      if (currentFilterType === 'belum') {
        temp = temp.filter(g => !(g.sentWA || g.sentUrl || g.sentText));
      } else if (currentFilterType === 'sudah') {
        temp = temp.filter(g => (g.sentWA || g.sentUrl || g.sentText));
      }

      filteredGuests = temp;
      currentIndex = 0;
      if (filteredGuests.length > 0) {
        renderGuest(currentIndex);
      } else {
        card.style.display = 'none';
      }
    }

    function undoStatus(e) {
      e.stopPropagation();
      const guest = filteredGuests[currentIndex];
      guest.sentWA = false;
      guest.sentUrl = false;
      guest.sentText = false;
      renderGuest(currentIndex);
    }

    // --- INITIALIZE ---
    document.addEventListener('DOMContentLoaded', () => {
      renderGuest(currentIndex);
    });
  </script>
